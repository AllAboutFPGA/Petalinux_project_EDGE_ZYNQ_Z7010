# EDGE ZYNQ: extra tools in the root file system
IMAGE_INSTALL:append = " ethtool usbutils iperf3 i2c-tools python3 libgpiod-tools v4l-utils devmem2 nano e2fsprogs-resize2fs parted dosfstools"

# at most 4 downloads at a time
do_fetch[number_threads] = "4"
IMAGE_BOOT_FILES:zynq = "BOOT.BIN boot.scr image.ub"

# EDGE ZYNQ: root login (root / root) on the serial console and over SSH
EXTRA_USERS_PARAMS:append = " usermod -p '\$6\$EdgeZynq2026\$FBlFKAXICMNUcWFlKDoXpkSiYtomEIdFij4vZP9DA.lPJAqumERIqfcOBnPyAq7N4q1dsmqv7gAqgEOasMnxM0' root;"
IMAGE_FEATURES:append:pn-petalinux-image-minimal = " allow-root-login"
